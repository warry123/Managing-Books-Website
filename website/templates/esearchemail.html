{% for user in users %}
    <tr>
        <td><div class="justify-center display-sideways">{{user.userid}}</div></td>
        <td><div class="justify-center display-sideways">{{user.email}}</div></td>
        <td><div class="justify-center display-sideways">{{user.name}}</div></td>
    </tr>
{% endfor %}
